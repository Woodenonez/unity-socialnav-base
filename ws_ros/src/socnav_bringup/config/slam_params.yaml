slam_toolbox:
  ros__parameters:
    use_sim_time: true
    
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # Publish map->odom immediately on first scan
    # minimum_travel_distance: 0.001
    # minimum_travel_heading: 0.001
    transform_publish_period: 0.02
    map_update_interval: 1.0

    # Timing tolerances for Unity bridge
    transform_timeout: 1.0
    tf_buffer_duration: 60.0
    throttle_scans: 1

    # Map parameters
    resolution: 0.05
    max_laser_range: 3.5
    minimum_time_interval: 0.1
    use_scan_matching: true
    use_scan_barycenter: true
    use_map_saver: true

    # Reduce how aggressively SLAM corrects odometry
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5

    # Only update map when robot has actually moved enough
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1